<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="robots" content="noindex,nofollow">
  <title>Acceso administrativo</title>
  <link rel="stylesheet" href="./css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js"></script>
  <script src="./js/login.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="back-link" href="../">← Volver a la página</a>
    <section class="auth-card">
      <div class="brand-mark" aria-hidden="true">C</div>
      <p class="eyebrow">ÁREA PRIVADA</p>
      <h1>Panel administrativo</h1>
      <p class="muted">Inicia sesión para administrar el negocio.</p>
      <form id="login-form">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" class="primary-button" type="submit">Iniciar sesión</button>
        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-footnote">Acceso exclusivo para personal autorizado.</p>
    </section>
  </main>
</body>
</html>
